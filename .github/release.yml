changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature]
    - title: Fixes
      labels: [fix, bug, hotfix]
    - title: Performance
      labels: [performance]
    - title: Maintenance
      labels: [chore, refactor, build, ci, style, test]
    - title: Documentation
      labels: [docs]
    - title: Other changes
      labels: ["*"]
