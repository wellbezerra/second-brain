name: Bug report
description: Report something that is not working
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Write in English.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
